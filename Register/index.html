<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Your Account</title>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/8.0.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.0.0/firebase-database.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.0.0/firebase-storage.js"></script>
  <style>
    body { font-family: 'Lato', sans-serif; }
    .loader {
      border-top-color: #6366f1;
      animation: spinner 1.5s linear infinite;
    }
    @keyframes spinner {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .image-preview {
      display: none;
      max-width: 150px;
      max-height: 150px;
      border-radius: 8px;
      margin-top: 10px;
      object-fit: cover;
    }
  </style>
</head>

  <a style="position:fixed;top:2px; right:2px; padding:10px; border:1px solid dodgerblue;background: dodgerblue; color:#fff" href="editprofile/">login now!</a>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">
<div class="bg-white rounded-2xl shadow-lg p-8 w-full max-w-md">
  <h1 class="text-2xl font-light text-gray-800 mb-6">Create Your Account</h1>
  <form id="accountForm" class="space-y-4">
    <div>
      <label for="fullName" class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
      <input type="text" id="fullName" placeholder="Daud Kamran Munna" class="w-full px-4 py-2 border rounded-lg focus:ring-2" required>
    </div>
    <div>
      <label for="nickname" class="block text-sm font-medium text-gray-700 mb-1">Nickname</label>
      <input type="text" id="nickname" placeholder="Munna" class="w-full px-4 py-2 border rounded-lg focus:ring-2" required>
    </div>
    <div>
      <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
      <input type="email" id="email" class="w-full px-4 py-2 border rounded-lg focus:ring-2" required>
      <p id="emailError" class="text-red-500 text-xs mt-1 hidden">This email is already registered</p>
    </div>
    <div>
      <label for="hobby" class="block text-sm font-medium text-gray-700 mb-1">Hobby (Optional)</label>
      <input type="text" id="hobby" class="w-full px-4 py-2 border rounded-lg focus:ring-2">
    </div>
    <div>
      <label for="profilePic" class="block text-sm font-medium text-gray-700 mb-1">Select Profile Picture</label>
      <input type="file" id="profilePic" accept="image/*" class="w-full text-sm">
      <img id="imagePreview" class="image-preview" alt="Profile Preview">
    </div>
    <div>
      <label for="fbProfile" class="block text-sm font-medium text-gray-700 mb-1">Facebook Profile (Optional)</label>
      <input type="url" id="fbProfile" placeholder="https://facebook.com/username" class="w-full px-4 py-2 border rounded-lg focus:ring-2">
    </div>
    <div>
      <label for="bio" class="block text-sm font-medium text-gray-700 mb-1">Short Bio (Optional)</label>
      <textarea id="bio" rows="3" class="w-full px-4 py-2 border rounded-lg focus:ring-2"></textarea>
    </div>
    <div>
      <label for="pincode" class="block text-sm font-medium text-gray-700 mb-1">6-digit Pincode</label>
      <input type="text" id="pincode" pattern="\d{6}" maxlength="6" placeholder="123456" class="w-full px-4 py-2 border rounded-lg focus:ring-2" required>
    </div>
    <div class="pt-2">
      <button type="submit" id="submitBtn" class="w-full bg-indigo-500 text-white py-2.5 rounded-lg flex items-center justify-center">
        <span id="buttonText">Create Account</span>
        <div id="loader" class="hidden loader border-4 border-gray-200 h-5 w-5 ml-2 rounded-full"></div>
      </button>
    </div>
  </form>
</div>
<div id="successAlert" class="fixed top-4 right-4 hidden">
  <div class="bg-green-100 border text-green-700 px-4 py-3 rounded relative w-80" role="alert">
    <strong class="font-bold">Success!</strong>
    <span class="block">Account created successfully.</span>
    <span class="absolute top-0 bottom-0 right-0 px-4 py-3 cursor-pointer" id="closeAlert">×</span>
  </div>
</div>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyAov5QhTpQ_1svMOFgWsg3E8tRalKrbs2U",
    authDomain: "last-197cd.firebaseapp.com",
    databaseURL: "https://last-197cd-default-rtdb.firebaseio.com",
    projectId: "last-197cd",
    storageBucket: "last-197cd.appspot.com",
    messagingSenderId: "176790808601",
    appId: "1:176790808601:web:af5bbe0fee206d74b86288",
    measurementId: "G-JPSKNHEVJT"
  };
  
  
  
  firebase.initializeApp(firebaseConfig);
  const database = firebase.database();
  const storage = firebase.storage();document.getElementById('profilePic').addEventListener('change', e => { const file = e.target.files[0]; if (file) { const reader = new FileReader(); reader.onload = event => { const preview = document.getElementById('imagePreview'); preview.src = event.target.result; preview.style.display = 'block'; }; reader.readAsDataURL(file); } });

document.getElementById('email').addEventListener('blur', function() { const email = this.value.trim(); if (email) checkEmailExists(email); });

function checkEmailExists(email) { database.ref('accounts').orderByChild('email').equalTo(email).once('value') .then(snapshot => { const exists = snapshot.exists(); document.getElementById('emailError').classList.toggle('hidden', !exists); document.getElementById('submitBtn').disabled = exists; }); }

document.getElementById('closeAlert').addEventListener('click', () => { document.getElementById('successAlert').classList.add('hidden'); });

document.getElementById('accountForm').addEventListener('submit', function(e) { e.preventDefault(); document.getElementById('loader').classList.remove('hidden'); document.getElementById('buttonText').textContent = 'Creating...'; document.getElementById('submitBtn').disabled = true; const formData = { fullName: document.getElementById('fullName').value, nickname: document.getElementById('nickname').value, email: document.getElementById('email').value, hobby: document.getElementById('hobby').value || null, fbProfile: document.getElementById('fbProfile').value || null, bio: document.getElementById('bio').value || null, pincode: document.getElementById('pincode').value, createdAt: firebase.database.ServerValue.TIMESTAMP, profilePicUrl: null }; const file = document.getElementById('profilePic').files[0]; if (file) { const storageRef = storage.ref('profile_pictures/' + Date.now() + '_' + file.name); storageRef.put(file).then(snapshot => snapshot.ref.getDownloadURL()) .then(url => { formData.profilePicUrl = url; saveAccount(formData); }).catch(console.error); } else { saveAccount(formData); } });

function saveAccount(data) { database.ref('accounts').push(data, error => { document.getElementById('loader').classList.add('hidden'); document.getElementById('buttonText').textContent = 'Create Account'; document.getElementById('submitBtn').disabled = false; if (!error) { document.getElementById('successAlert').classList.remove('hidden'); document.getElementById('accountForm').reset(); document.getElementById('imagePreview').style.display = 'none'; } }); } 

  // Disable right-click context menu on images
document.addEventListener("contextmenu", e => {
  if (e.target.tagName === 'IMG') e.preventDefault();
});

// Disable text and image selection
document.addEventListener("selectstart", e => e.preventDefault());
document.addEventListener("dragstart", e => e.preventDefault());

// Block common devtools shortcuts
document.addEventListener("keydown", e => {
  if (
    (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) || // Ctrl+Shift+I/J/C
    (e.ctrlKey && e.key === 'U') || // Ctrl+U (view source)
    (e.key === 'F12') // F12
  ) {
    e.preventDefault();
    alert("Not allowed!");
  }
});

// Disable console access
setInterval(() => {
  const consoleCheck = /./;
  consoleCheck.toString = function() {
    throw "Console access is disabled!";
  }
  console.log(consoleCheck);
}, 1000);
  
</script>

</body>
</html>
