    <style>
        body {
            font-family: 'Lato', sans-serif;
            background-color: ghostwhite;
        }
        
        .names {
          margin-top:100px;
          font-size: 25px;
        }
        
        .profile-card {
            transition: all 0.3s ease;
            background-color: #f9fafb; /* Off-white background */
        }
        .profile-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #6366f1;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
     
        .hobby-badge {
            background-color: #E0E7FF;
            color: #4661e5;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: .85rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            transition: all 0.2s ease;
        }
        .hobby-badge:hover {
            transform: scale(1.05);
            box-shadow: 0 2px 5px rgba(79, 70, 229, 0.2);
        }
        .bio-text {
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.5;
        }
        .card-border {
            border: 1px solid rgba(0, 0, 0, 0.05);
        }
        .search-btn {
            transition: all 0.2s ease;
        }
        .search-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        
           
        .avatar::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                to bottom right,
                rgba(255, 255, 255, 0) 0%,
                rgba(255, 255, 255, 0) 77%,
                rgba(255, 255, 255, 0.3) 92%,
                rgba(255, 255, 255, 0) 100%
            );
            transform: rotate(30deg);
            transition: all 0.7s ease;
        }
        .avatar:hover::after {
            left: 100%;
            top: 100%;
        }
   

.status-bubble:hover {
    transform: scale(1.05) translateY(-2px);
    box-shadow: 0 6px 15px rgba(0, 0, 0, 0.4);
    background-color: #FFFFE2;
}

.avatar {
    margin-top: 50px;
    transition: all 0.3s ease;
    width: 200px;
    height: 200px;
    border-radius: 50%;
    border: 1px solid white;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    object-fit: cover;
    position: relative; /* This is important for absolute positioning of child elements */
    overflow: hidden;
    z-index: 1; /* Added to ensure avatar stays below status bubble */
}

.status-bubble {
    position: absolute;
    top: 120px; /* Increased from 2px to prevent overlap */
    right: 10px; /* Increased from 2px to prevent overlap */
    background-color: #FFFFE2;
    color: #000;
    border-radius: 12px;
    padding: 8px 14px;
    font-size: 15px;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    font-family: 'Delius', cursive;
    font-weight: 400;
    font-style: normal;
    z-index: 2; /* Higher than avatar's z-index */
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    transform-origin: bottom right;
    transition: all 0.3s ease;
    cursor: pointer;
}

/* Adjust the bubble tails to match new position */
.status-bubble::after {
    content: "";
    position: absolute;
    bottom: -8px;
    right: 20px;
    width: 12px;
    height: 12px;
    background-color: #FFFFE2;
    border-radius: 50%;
    box-shadow: 2px 2px 3px rgba(0, 0, 0, 0.2);
    transition: all 0.3s ease;
}

.status-bubble::before {
    content: "";
    position: absolute;
    bottom: -16px;
    right: 30px;
    width: 8px;
    height: 8px;
    background-color: #FFFFE2;
    border-radius: 50%;
    box-shadow: 1px 1px 2px rgba(0, 0, 0, 0.2);
    transition: all 0.3s ease;
}

/* Rest of your existing styles remain the same */

.status-bubble:hover::after {
    background-color: #FFFFE2;
    transform: scale(0.9) translateY(2px);
}


.status-bubble:hover::before {
    background-color: #FFFFE2;
    transform: scale(0.8) translateY(2px);
}

.status-bubble i {
    margin-right: 6px;

    transition: transform 0.3s ease;
}

.status-bubble:hover i {
    transform: rotate(5deg);
}

/* Optional: Add a subtle pulse animation */
@keyframes bubblePulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.03); }
    100% { transform: scale(1); }
}

.status-bubble {
    animation: bubblePulse 4s infinite;
}

.status-bubble:hover {
    animation: none;
}

    <!-- Profile Card Template (hidden) -->

  <script>
    // Firebase configuration
    const firebaseConfig = {
        apiKey: "AIzaSyAov5QhTpQ_1svMOFgWsg3E8tRalKrbs2U",
        authDomain: "last-197cd.firebaseapp.com",
        databaseURL: "https://last-197cd-default-rtdb.firebaseio.com",
        projectId: "last-197cd",
        storageBucket: "last-197cd.appspot.com",
        messagingSenderId: "176790808601",
        appId: "1:176790808601:web:af5bbe0fee206d74b86288",
        measurementId: "G-JPSKNHEVJT"
    };
    firebase.initializeApp(firebaseConfig);
const database = firebase.database();


    // Updated performSearch function to handle section filtering
    function performSearch() {
        const searchValue = searchInput.value.toLowerCase();
        const cards = profilesContainer.querySelectorAll(".profile-card");
        let visibleCount = 0;
        
        // Define our section mappings
        const sectionMap = {
            'alpha': 'a',
            'binary': 'b',
            'cipher': 'c'  // or whatever your default code is
        };
        
        cards.forEach(card => {
            const nameElement = card.querySelector('.names');
            const nicknameElement = card.querySelector('.text-indigo-600');
            const hobbyElement = card.querySelector('[data-name="hobby"]');
            const secBadge = card.querySelector('.hobby-badge');
            
            const name = nameElement ? nameElement.textContent.toLowerCase() : '';
            const nickname = nicknameElement ? nicknameElement.textContent.toLowerCase() : '';
            const hobby = hobbyElement ? hobbyElement.textContent.toLowerCase() : '';
            const secValue = secBadge ? secBadge.getAttribute('data-sec') : '';
            
            // Check if search matches any field or specifically a section
            const matchesName = name.includes(searchValue);
            const matchesNickname = nickname.includes(searchValue);
            const matchesHobby = hobby.includes(searchValue);
            
            // Special handling for section search
            let matchesSection = false;
            if (searchValue === 'alpha' || searchValue === 'binary' || searchValue === 'cipher') {
                matchesSection = secValue === sectionMap[searchValue];
            } else {
                // Fallback to regular text search in section badge
                const secText = secBadge ? secBadge.textContent.toLowerCase() : '';
                matchesSection = secText.includes(searchValue);
            }
            
            if (matchesName || matchesNickname || matchesHobby || matchesSection) {
                card.style.display = "block";
                visibleCount++;
            } else {
                card.style.display = "none";
            }
        });
        
        profileCount.textContent = visibleCount;
        
        if (visibleCount === 0) {
            emptyState.classList.remove("hidden");
            profilesContainer.classList.add("hidden");
        } else {
            emptyState.classList.add("hidden");
            profilesContainer.classList.remove("hidden");
        }
    }

    // Updated profile card creation to include data-sec attribute
    function loadProfiles() {
        database.ref("accounts").once("value", (snapshot) => {
            const profilesData = snapshot.val();
            profilesContainer.innerHTML = "";
            let count = 0;
            
            if (profilesData) {
                const profilesArray = shuffleArray(Object.entries(profilesData));
                const avatarPromises = [];
                
                profilesArray.forEach(([userId, profile]) => {
                    if (!profile) return;
                    
                    const card = profileTemplate.content.cloneNode(true);
                    const header = card.querySelector('.bg-white');
                    const nameContainer = card.querySelector('.flex-col.items-center');
                    
                    // Add name and nickname
                    const nameElement = document.createElement('h3');
                    nameElement.className = 'names';
                    nameElement.textContent = profile.fullName || "Unknown Name";
                    
                    const nicknameElement = document.createElement('p');
                    nicknameElement.className = 'text-indigo-600';
                    nicknameElement.textContent = profile.nickname ? `@${profile.nickname}` : "@unknown";
                    
                    nameContainer.appendChild(nameElement);
                    nameContainer.appendChild(nicknameElement);
                    
                    // Fill profile data
                    card.querySelector('[data-name="email"]').textContent = profile.email || "Not provided";
                    card.querySelector('[data-name="hobby"]').textContent = profile.hobby || "No hobby specified";
                    card.querySelector('[data-name="bio"]').textContent = profile.bio || "No bio provided";
                    
                    // Handle section badge with both display text and raw value
                    const badge = card.querySelector('.hobby-badge');
                    const secText = badge.querySelector('[data-name="sec"]');
                    
                    // Store raw value in data attribute
                    badge.setAttribute('data-sec', profile.sec || '');
                    
                    // Set display text
                    if (profile.sec === 'a') {
                        badge.style.backgroundColor = '#D1FAE5';
                        secText.textContent = 'Alpha';
                        secText.style.color = '#065F46';
                    } else if (profile.sec === 'b') {
                        badge.style.backgroundColor = '#FECACA';
                        secText.textContent = 'Binary';
                        secText.style.color = '#7F1D1D';
                    } else {
                        badge.style.backgroundColor = '#E0F2FE';
                        secText.textContent = 'Cipher';
                        secText.style.color = '#0369A1';
                    }
                    
                    // Rest of the profile creation code...
                    
                    const avatarPromise = createAvatar(profile, userId).then(avatar => {
                        header.appendChild(avatar);
                        profilesContainer.appendChild(card);
                        count++;
                    });
                    
                    avatarPromises.push(avatarPromise);
                });
                
                Promise.all(avatarPromises).then(() => {
                    profileCount.textContent = count;
                    loadingState.classList.add("hidden");
                    
                    if (count > 0) {
                        profilesContainer.classList.remove("hidden");
                        emptyState.classList.add("hidden");
                    } else {
                        profilesContainer.classList.add("hidden");
                        emptyState.classList.remove("hidden");
                    }
                });
            } else {
                loadingState.classList.add("hidden");
                emptyState.classList.remove("hidden");
            }
        }).catch(error => {
            console.error("Error loading profiles:", error);
            loadingState.classList.add("hidden");
            emptyState.classList.remove("hidden");
        });
    }
loadProfiles();
    // Rest of the code remains the same...
</script>
