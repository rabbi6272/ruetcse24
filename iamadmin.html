<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/8.0.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.0.0/firebase-database.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.0.0/firebase-storage.js"></script>
  <style>
    body { font-family: 'Lato', sans-serif; }
    .loader {
      border-top-color: #6366f1;
      animation: spinner 1.5s linear infinite;
    }
    @keyframes spinner {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .profile-image {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      object-fit: cover;
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen">
  <div class="bg-indigo-600 text-white p-4 shadow-md">
    <div class="container mx-auto flex justify-between items-center">
      <h1 class="text-2xl font-bold">Admin Dashboard</h1>
      <button id="logoutBtn" class="bg-white text-indigo-600 px-4 py-2 rounded-md hover:bg-gray-100">Logout</button>
    </div>
  </div>

  <div class="container mx-auto p-4">
    <div class="bg-white rounded-lg shadow-md p-6">
      <div class="flex justify-between items-center mb-6">
        <h2 class="text-xl font-semibold text-gray-800">All User Profiles</h2>
        <div class="relative">
          <input type="text" id="searchInput" placeholder="Search users..." class="pl-10 pr-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
          <div class="absolute left-3 top-2.5 text-gray-400">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
          </div>
        </div>
      </div>

      <div class="overflow-x-auto">
        <table class="min-w-full divide-y divide-gray-200">
          <thead class="bg-gray-50">
            <tr>
              <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Profile</th>
              <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Name</th>
              <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Email</th>
              <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Nickname</th>
              <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Joined</th>
              <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
            </tr>
          </thead>
          <tbody id="usersTableBody" class="bg-white divide-y divide-gray-200">
            <!-- Users will be loaded here -->
          </tbody>
        </table>
      </div>

      <div id="loadingIndicator" class="flex justify-center items-center py-8">
        <div class="loader border-4 border-gray-200 h-8 w-8 rounded-full"></div>
      </div>

      <div id="noUsersMessage" class="text-center py-8 text-gray-500 hidden">
        No users found.
      </div>
    </div>
  </div>

  <!-- Delete Confirmation Modal -->
  <div id="deleteModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden">
    <div class="bg-white rounded-lg p-6 max-w-md w-full">
      <h3 class="text-lg font-medium text-gray-900 mb-4">Confirm Deletion</h3>
      <p class="text-sm text-gray-500 mb-6">Are you sure you want to delete this user account? This action cannot be undone.</p>
      <div class="flex justify-end space-x-3">
        <button id="cancelDelete" class="px-4 py-2 border border-gray-300 rounded-md text-sm font-medium text-gray-700 hover:bg-gray-50">Cancel</button>
        <button id="confirmDelete" class="px-4 py-2 bg-red-600 rounded-md text-sm font-medium text-white hover:bg-red-700">Delete</button>
      </div>
    </div>
  </div>

  <!-- Alert Notification -->
  <div id="alertNotification" class="fixed top-4 right-4 hidden">
    <div class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded relative w-80" role="alert">
      <strong class="font-bold" id="alertTitle">Success!</strong>
      <span class="block" id="alertMessage">User deleted successfully.</span>
      <span class="absolute top-0 bottom-0 right-0 px-4 py-3 cursor-pointer" id="closeAlert">
        <svg class="fill-current h-6 w-6 text-green-500" role="button" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><title>Close</title><path d="M14.348 14.849a1.2 1.2 0 0 1-1.697 0L10 11.819l-2.651 3.029a1.2 1.2 0 1 1-1.697-1.697l2.758-3.15-2.759-3.152a1.2 1.2 0 1 1 1.697-1.697L10 8.183l2.651-3.031a1.2 1.2 0 1 1 1.697 1.697l-2.758 3.152 2.758 3.15a1.2 1.2 0 0 1 0 1.698z"/></svg>
      </span>
    </div>
  </div>

<script>
  // Firebase configuration
  const firebaseConfig = {
    apiKey: "AIzaSyAov5QhTpQ_1svMOFgWsg3E8tRalKrbs2U",
    authDomain: "last-197cd.firebaseapp.com",
    databaseURL: "https://last-197cd-default-rtdb.firebaseio.com",
    projectId: "last-197cd",
    storageBucket: "last-197cd.appspot.com",
    messagingSenderId: "176790808601",
    appId: "1:176790808601:web:af5bbe0fee206d74b86288",
    measurementId: "G-JPSKNHEVJT"
  };

  // Initialize Firebase
  firebase.initializeApp(firebaseConfig);
  const database = firebase.database();
  const storage = firebase.storage();

  // Global variables
  let usersData = {};
  let userToDelete = null;

  // DOM elements
  const usersTableBody = document.getElementById('usersTableBody');
  const loadingIndicator = document.getElementById('loadingIndicator');
  const noUsersMessage = document.getElementById('noUsersMessage');
  const searchInput = document.getElementById('searchInput');
  const deleteModal = document.getElementById('deleteModal');
  const alertNotification = document.getElementById('alertNotification');

  // Event listeners
  document.getElementById('logoutBtn').addEventListener('click', () => {
    window.location.href = 'login.html'; // Redirect to login page
  });

  document.getElementById('closeAlert').addEventListener('click', () => {
    alertNotification.classList.add('hidden');
  });

  document.getElementById('cancelDelete').addEventListener('click', () => {
    deleteModal.classList.add('hidden');
  });

  document.getElementById('confirmDelete').addEventListener('click', deleteUser);

  searchInput.addEventListener('input', filterUsers);

  // Load all users on page load
  window.addEventListener('DOMContentLoaded', loadAllUsers);

  // Functions
  function loadAllUsers() {
    database.ref('accounts').once('value')
      .then(snapshot => {
        usersData = snapshot.val() || {};
        renderUsersTable(usersData);
        loadingIndicator.classList.add('hidden');
        
        if (Object.keys(usersData).length === 0) {
          noUsersMessage.classList.remove('hidden');
        }
      })
      .catch(error => {
        console.error('Error loading users:', error);
        loadingIndicator.classList.add('hidden');
        noUsersMessage.classList.remove('hidden');
      });
  }

  function renderUsersTable(users) {
    usersTableBody.innerHTML = '';
    
    if (Object.keys(users).length === 0) {
      noUsersMessage.classList.remove('hidden');
      return;
    } else {
      noUsersMessage.classList.add('hidden');
    }
    
    Object.entries(users).forEach(([userId, userData]) => {
      const row = document.createElement('tr');
      
      // Format date
      const joinDate = userData.createdAt ? new Date(userData.createdAt) : new Date();
      const formattedDate = joinDate.toLocaleDateString('en-US', {
        year: 'numeric',
        month: 'short',
        day: 'numeric'
      });
      
      // Default image if no profile picture
      const profileImage = userData.profilePicUrl || 'https://via.placeholder.com/60';
      
      row.innerHTML = `
        <td class="px-6 py-4 whitespace-nowrap">
          <div class="flex items-center">
            <div class="flex-shrink-0">
              <img class="profile-image" src="${profileImage}" alt="${userData.fullName || 'User'}">
            </div>
          </div>
        </td>
        <td class="px-6 py-4 whitespace-nowrap">
          <div class="text-sm font-medium text-gray-900">${userData.fullName || 'N/A'}</div>
        </td>
        <td class="px-6 py-4 whitespace-nowrap">
          <div class="text-sm text-gray-500">${userData.email || 'N/A'}</div>
        </td>
        <td class="px-6 py-4 whitespace-nowrap">
          <div class="text-sm text-gray-500">${userData.nickname || 'N/A'}</div>
        </td>
        <td class="px-6 py-4 whitespace-nowrap">
          <div class="text-sm text-gray-500">${formattedDate}</div>
        </td>
        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
          <button data-userid="${userId}" class="delete-btn text-red-600 hover:text-red-900">Delete</button>
        </td>
      `;
      
      usersTableBody.appendChild(row);
    });
    
    // Add event listeners to all delete buttons
    document.querySelectorAll('.delete-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        userToDelete = e.target.getAttribute('data-userid');
        deleteModal.classList.remove('hidden');
      });
    });
  }

  function filterUsers() {
    const searchTerm = searchInput.value.toLowerCase();
    const filteredUsers = {};
    
    Object.entries(usersData).forEach(([userId, userData]) => {
      const matchesSearch = 
        (userData.fullName && userData.fullName.toLowerCase().includes(searchTerm)) ||
        (userData.email && userData.email.toLowerCase().includes(searchTerm)) ||
        (userData.nickname && userData.nickname.toLowerCase().includes(searchTerm));
      
      if (matchesSearch) {
        filteredUsers[userId] = userData;
      }
    });
    
    renderUsersTable(filteredUsers);
  }

  function deleteUser() {
    if (!userToDelete) return;
    
    deleteModal.classList.add('hidden');
    
    // Get user data before deleting to remove profile picture
    const userData = usersData[userToDelete];
    
    // Delete profile picture if exists
    if (userData.profilePicUrl) {
      const pictureRef = storage.refFromURL(userData.profilePicUrl);
      pictureRef.delete().catch(error => {
        console.error('Error deleting profile picture:', error);
      });
    }
    
    // Delete user from database
    database.ref('accounts/' + userToDelete).remove()
      .then(() => {
        // Remove from local data
        delete usersData[userToDelete];
        
        // Update UI
        renderUsersTable(usersData);
        
        // Show success message
        showAlert('Success', 'User deleted successfully.');
      })
      .catch(error => {
        console.error('Error deleting user:', error);
        showAlert('Error', 'Failed to delete user.', 'error');
      });
  }

  function showAlert(title, message, type = 'success') {
    const alertDiv = alertNotification.querySelector('div');
    
    // Set alert style based on type
    if (type === 'success') {
      alertDiv.className = 'bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded relative w-80';
    } else {
      alertDiv.className = 'bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative w-80';
    }
    
    document.getElementById('alertTitle').textContent = title;
    document.getElementById('alertMessage').textContent = message;
    alertNotification.classList.remove('hidden');
    
    // Auto-hide after 5 seconds
    setTimeout(() => {
      alertNotification.classList.add('hidden');
    }, 5000);
  }
</script>
</body>
</html>
