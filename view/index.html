<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Updated Nicknames</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
      color: #333;
    }

    textarea {
      width: 100%;
      height: 150px;
      padding: 10px;
      font-family: monospace;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 4px;
      background-color: #fff;
      resize: none;
    }

    #message {
      margin-top: 20px;
      text-align: center;
      color: #dc3545;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>Updated Nicknames</h1>
  <textarea id="nicknameArray" readonly></textarea>
  <p id="message"></p>

  <!-- Firebase SDK v8.0.0 -->
  <script src="https://www.gstatic.com/firebasejs/8.0.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.0.0/firebase-database.js"></script>

  <script>
    // Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyAov5QhTpQ_1svMOFgWsg3E8tRalKrbs2U",
      authDomain: "last-197cd.firebaseapp.com",
      databaseURL: "https://last-197cd-default-rtdb.firebaseio.com",
      projectId: "last-197cd",
      storageBucket: "last-197cd.appspot.com",
      messagingSenderId: "176790808601",
      appId: "1:176790808601:web:af5bbe0fee206d74b86288",
      measurementId: "G-JPSKNHEVJT"
    };

    // Initialize Firebase
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }

    const database = firebase.database();

    // Function to fetch and display updated nicknames in a copyable array format
    function fetchAndDisplayNicknames() {
      const usersRef = database.ref('users');
      const nicknameArrayElement = document.getElementById('nicknameArray');

      usersRef.on('value', (snapshot) => {
        const updatedNames = [];

        snapshot.forEach((childSnapshot) => {
          const user = childSnapshot.val();
          const nickname = user.hasChangedNickname ? user.nickname : user.name; // Use updated nickname or default name
          updatedNames.push(nickname);
        });

        // Display the array in a copyable format
        nicknameArrayElement.value = JSON.stringify(updatedNames, null, 2);
      });
    }

    // Fetch and display nicknames on page load
    window.onload = () => {
      fetchAndDisplayNicknames();
    };
  </script>
</body>
</html>
