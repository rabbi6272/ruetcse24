<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Nickname Updater</title>
  <style>
    body {

      background-color: #f4f4f4;
      margin: 0;

    }

    h1 {

    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    th, td {
      padding: 10px;
      border: 1px solid #ccc;
      text-align: left;
    }

    th {
      background-color: #28a745;
      color: #fff;
    }

    tr:nth-child(even) {
      background-color: #f9f9f9;
    }

    tr:hover {
      background-color: #f1f1f1;
    }

    button {
      padding: 5px 10px;
      background-color: #007bff;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    button:disabled {

    #message {

      text-align: center;
      color: #dc3545;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>User Nickname Updater</h1>
  <table id="userTable">
    <thead>

        <th>Name</th>

      "ANIKA", "FARIHA", "SIYAM", "SHADMAN", "RAHIDUL", "ABIR", "MONTAHA", "NAHID", "ASHIK", "BRISTY",
      "MAHADI", "SUMON", "IMRUL", "PRANTO", "MUKIT", "MITHI", "ARIAN", "ATHAI", "MUHIUDDIN", "SOURAV",

      "SADIA", "ABHIJIT", "MAHIN", "DEEP", "MASUM", "PRITOM", "SUMIT", "SIHAB", "SIHAB", "RAFI",
      "FAHMID", "UTSHA", "TANJIMA", "NAHIN", "MORCHHALIN", "SOMUDRO", "MUNTASIR", "ARNOB", "ELEM", "AFNAN",

      "ARPITA", "KABIR", "SAROAR", "JIM", "AVIJET", "PRONOB", "MAHMODUL", "SAMI", "BOBY", "ROMJAN",
      "MEHEDI", "MEHERAB", "ANUP", "TASNIMUL", "MEHEDI", "RIMA", "SHAHRIAR", "MUBINUR", "LIMA", "HIRA"
    ];

    // Function to initialize data in Firebase
    function initializeData() {
      const usersRef = database.ref('users');
      usersRef.once('value').then((snapshot) => {
        if (!snapshot.exists()) {
          names.forEach((name, index) => {
            const userId = `user${index + 1}`;
            usersRef.child(userId).set({
              name: name,
              nickname: name,
              hasChangedNickname: false
            });
          });
          console.log("Data initialized in Firebase.");
        }
      });
    }

    // Function to fetch and display users in the table
    function fetchAndDisplayUsers() {
      const usersRef = database.ref('users');
      const tableBody = document.querySelector('#userTable tbody');

      usersRef.on('value', (snapshot) => {
        tableBody.innerHTML = ''; // Clear existing rows
        let sl = 1; // Serial number counter
        snapshot.forEach((childSnapshot) => {
          const user = childSnapshot.val();
          const userId = childSnapshot.key;
          const row = document.createElement('tr');

          row.innerHTML = `
            <td>${sl}</td> <!-- Serial number -->
            <td>${user.name}</td>
            <td>${user.nickname}</td>
            <td>
              <button onclick="updateNickname('${userId}')" ${user.hasChangedNickname ? 'disabled' : ''}>
                ${user.hasChangedNickname ? 'Updated' : 'Update'}
              </button>
            </td>
          `;

          tableBody.appendChild(row);
          sl++; // Increment serial number
        });
      });
    }

    // Function to update nickname
    function updateNickname(userId) {
      const newNickname = prompt("Enter new nickname:");
      if (newNickname) {
        const userRef = database.ref(`users/${userId}`);
        userRef.update({
          nickname: newNickname,
          hasChangedNickname: true
        }).then(() => {
          document.getElementById('message').textContent = "Nickname updated successfully!";
        }).catch((error) => {
          document.getElementById('message').textContent = "Error updating nickname: " + error.message;
        });
      }
    }

    // Initialize data and fetch users on page load
    window.onload = () => {
      initializeData();
      fetchAndDisplayUsers();
    };
  </script>
</body>
    </html>
