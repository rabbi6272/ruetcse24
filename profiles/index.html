    <style>
                    body {
            font-family: 'Lato', sans-serif;
            background-color: ghostwhite;
        }
        
        .names {
          margin-top:100px;
          font-size: 25px;
        }
        
        .profile-card {
            transition: all 0.3s ease;
            background-color: #f9fafb; /* Off-white background */
        }
        .profile-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #6366f1;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
     
        .hobby-badge {
            background-color: #E0E7FF;
            color: #4F46E5;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            transition: all 0.2s ease;
        }
        .hobby-badge:hover {
            transform: scale(1.05);
            box-shadow: 0 2px 5px rgba(79, 70, 229, 0.2);
        }
        .bio-text {
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.5;
        }
        .card-border {
            border: 1px solid rgba(0, 0, 0, 0.05);
        }
        .search-btn {
            transition: all 0.2s ease;
        }
        .search-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        
           
        .avatar::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                to bottom right,
                rgba(255, 255, 255, 0) 0%,
                rgba(255, 255, 255, 0) 77%,
                rgba(255, 255, 255, 0.3) 92%,
                rgba(255, 255, 255, 0) 100%
            );
            transform: rotate(30deg);
            transition: all 0.7s ease;
        }
        .avatar:hover::after {
            left: 100%;
            top: 100%;
        }
   

.status-bubble:hover {
    transform: scale(1.05) translateY(-2px);
    box-shadow: 0 6px 15px rgba(0, 0, 0, 0.4);
    background-color: #4f46e5;
}

.avatar {
    margin-top: 50px;
    transition: all 0.3s ease;
    width: 200px;
    height: 200px;
    border-radius: 50%;
    border: 1px solid white;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    object-fit: cover;
    position: relative; /* This is important for absolute positioning of child elements */
    overflow: hidden;
    z-index: 1; /* Added to ensure avatar stays below status bubble */
}

.status-bubble {
    position: absolute;
    top: 10px; /* Increased from 2px to prevent overlap */
    right: 10px; /* Increased from 2px to prevent overlap */
    background-color: #FFFFE2;
    color: #000;
    border-radius: 12px;
    padding: 8px 14px;
    font-size: 15px;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    font-family: 'Delius', cursive;
    font-weight: 400;
    font-style: normal;
    z-index: 2; /* Higher than avatar's z-index */
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    transform-origin: bottom right;
    transition: all 0.3s ease;
    cursor: pointer;
}

/* Adjust the bubble tails to match new position */
.status-bubble::after {
    content: "";
    position: absolute;
    bottom: -8px;
    right: 20px;
    width: 12px;
    height: 12px;
    background-color: #FFFFE2;
    border-radius: 50%;
    box-shadow: 2px 2px 3px rgba(0, 0, 0, 0.2);
    transition: all 0.3s ease;
}

.status-bubble::before {
    content: "";
    position: absolute;
    bottom: -16px;
    right: 30px;
    width: 8px;
    height: 8px;
    background-color: #FFFFE2;
    border-radius: 50%;
    box-shadow: 1px 1px 2px rgba(0, 0, 0, 0.2);
    transition: all 0.3s ease;
}

/* Rest of your existing styles remain the same */

.status-bubble:hover::after {
    background-color: #4f46e5;
    transform: scale(0.9) translateY(2px);
}


.status-bubble:hover::before {
    background-color: #4f46e5;
    transform: scale(0.8) translateY(2px);
}

.status-bubble i {
    margin-right: 6px;

    transition: transform 0.3s ease;
}

.status-bubble:hover i {
    transform: rotate(5deg);
}

/* Optional: Add a subtle pulse animation */
@keyframes bubblePulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.03); }
    100% { transform: scale(1); }
}

.status-bubble {
    animation: bubblePulse 4s infinite;
}

.status-bubble:hover {
    animation: none;
            }
    </style>
</head>


    
<body class="min-h-screen p-4">

        <!-- Search and Stats -->

                    </svg>
                    <span id="profileCount">0</span>&nbsp; profiles found
                </div>
            </div>
        </div>
        
        <!-- Loading State -->
        <div id="loadingState" class="text-center py-12">
            <div class="loader"></div>
            <p class="mt-2 text-gray-600">Loading profiles...</p>
        </div>
        
        <!-- Profiles Grid -->
        <div id="profilesContainer" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 hidden">
            <!-- Profiles will be loaded here dynamically -->
        </div>
        
        <!-- Empty State -->
        <div id="emptyState" class="text-center py-12 hidden">
            <svg class="mx-auto h-12 w-12 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            <h3 class="mt-2 text-lg font-medium text-gray-900">No profiles found</h3>
            <p class="mt-1 text-gray-500">Try adjusting your search or filter to find what you're looking for.</p>
        </div>
    </div>

    <!-- Profile Card Template (hidden) -->
    <template id="profileTemplate">
        <div class="profile-card relative rounded-xl shadow-sm overflow-hidden hover:shadow-md card-border">
            <div class="bg-white h-40 flex items-center justify-center p-4 relative">
                <!-- Profile image will be inserted here -->

            <div class="p-5">
                <div class="flex flex-col items-center text-center -mt-16 mb-4">
                    <!-- Name and nickname will be inserted here -->

                <div class="mt-2 pt-4 border-t border-gray-100 flex items-start gap-2">
                    <i style="font-size:15px;color:gray" class="fa">&#xf10d;</i>
                    <p class="text-lg text-dark-400 bio-text" data-name="bio" style="font-family: 'Delius', cursive; font-weight: 400; font-style: normal;">No bio provided</p>
                </div>
                
                <div class="mt-4 space-y-3">
                    <div class="flex items-center justify-center text-lg text-gray-500">
                        <i class="fas fa-envelope mr-1.5 h-5 w-5 text-gray-400"></i>
                        <span data-name="email">email@example.com</span>
                    </div>
                    
                    <div class="flex justify-center" data-name="hobbyContainer">
                        <span class="flex items-center text-lg text-dark-500">
                            <i class="fas fa-fire h-4 w-4 mr-1 text-red-400"></i>

                    <div class="flex justify-center text-lg text-gray-500" data-name="fbContainer">

                    <span class="text-gray-600 text-sm">Updated <span id="uw">0 mins ago</span></span>
                    
                </div>
