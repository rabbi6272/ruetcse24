<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RUET CSE 24</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #154360;
            --secondary: #2980B9;
            --accent: #E74C3C;
            --light: #ECF0F1;
            --dark: #1B2631;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--light);
            color: var(--dark);
            overflow-x: hidden;
            line-height: 1.6;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        
        header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 60px 0;
            text-align: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .header-content {
            position: relative;
            z-index: 2;
            animation: fadeInUp 1s ease-out;
        }
        
        h1 {
            font-size: 3.5rem;
            margin-bottom: 20px;
            font-weight: 700;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .subtitle {
            font-size: 1.5rem;
            font-weight: 300;
            margin-bottom: 30px;
            font-family: 'Roboto', sans-serif;
            opacity: 0.9;
        }
        
        .hashtag {
            display: inline-block;
            background-color: rgba(255,255,255,0.2);
            padding: 10px 20px;
            border-radius: 50px;
            font-weight: 700;
            letter-spacing: 1px;
            margin-top: 20px;
            transition: all 0.3s ease;
        }
        
        .hashtag:hover {
            background-color: rgba(255,255,255,0.3);
            transform: scale(1.05);
        }
        
        .palestine-flag {
            position: absolute;
            width: 150px;
            height: 100px;
            background: linear-gradient(to bottom, 
                #000000 0%, #000000 33.33%, 
                #FFFFFF 33.33%, #FFFFFF 66.66%, 
                #149954 66.66%, #149954 100%);
            border-left: 30px solid #E4312b;
            z-index: 1;
            animation: float 6s ease-in-out infinite;
        }
        
        .flag-1 {
            top: 20%;
            left: 10%;
            opacity: 0.7;
        }
        
        .flag-2 {
            bottom: 15%;
            right: 8%;
            opacity: 0.6;
            animation-delay: 1s;
        }
        
        .flag-3 {
            top: 40%;
            right: 20%;
            opacity: 0.5;
            animation-delay: 2s;
        }
        
        .main-content {
            padding: 80px 0;
            text-align: center;
        }
        
        .statement {
            max-width: 800px;
            margin: 0 auto 50px;
            font-size: 1.2rem;
            line-height: 1.8;
            animation: fadeIn 1.5s ease-out;
        }
        
        .solidarity-image {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.5s ease, box-shadow 0.5s ease;
            animation: fadeInUp 1s ease-out 0.5s both;
        }
        
        .solidarity-image:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }
        
        .call-to-action {
            background-color: var(--accent);
            color: white;
            padding: 60px 0;
            text-align: center;
            margin-top: 50px;
            clip-path: polygon(0 15%, 100% 0, 100% 85%, 0 100%);
        }
        
        .cta-content {
            max-width: 800px;
            margin: 0 auto;
            animation: fadeIn 1s ease-out;
        }
        
        h2 {
            font-size: 2.5rem;
            margin-bottom: 20px;
        }
        
        .cta-button {
            display: inline-block;
            background-color: white;
            color: var(--accent);
            padding: 15px 40px;
            border-radius: 50px;
            font-weight: 700;
            text-decoration: none;
            margin-top: 30px;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .cta-button:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        
        footer {
            background-color: var(--dark);
            color: white;
            text-align: center;
            padding: 30px 0;
            font-family: 'Roboto', sans-serif;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @keyframes fadeInUp {
            from { 
                opacity: 0;
                transform: translateY(30px);
            }
            to { 
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(3deg); }
            100% { transform: translateY(0) rotate(0deg); }
        }
        
        @media (max-width: 768px) {
            h1 {
                font-size: 2.5rem;
            }
            
            .subtitle {
                font-size: 1.2rem;
            }
            
            .palestine-flag {
                width: 100px;
                height: 70px;
            }
            
            .statement {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="palestine-flag flag-1"></div>
        <div class="palestine-flag flag-2"></div>
        <div class="palestine-flag flag-3"></div>
        
        <div class="container header-content">
            <h1>Our strike Today Speaks for Palestine</h1>
            <p class="subtitle">In Solidarity, We Pause</p>
            <div class="hashtag">#Global_Strike</div>
        </div>
    </header>
    
  
    <footer>
        <div class="container">
            <p>In solidarity with the Palestinian people | #Global_Strike</p>
            <p><small>This is a symbolic demonstration of support. We stand for peace, justice, and human rights for all.</small></p>
        </div>
    </footer>
</body>
</html>
